[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-random"
version = "1.0.0"
description = "Generador decimal experimental desde ruido I/Q RTL-SDR, SHA-256 y rechazo"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
rtl = ["pyrtlsdr>=0.3.0,<0.6"]
dev = ["build>=1,<2"]

[project.scripts]
sdr-random = "sdr_random.cli:main"

[tool.setuptools.packages.find]
include = ["sdr_random*"]
